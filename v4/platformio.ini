; PlatformIO Project Configuration File
; ESP32 Random-Channel RF Test Generator V4

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags = 
    -DCORE_DEBUG_LEVEL=3
    -Wall
    -Wextra
    -Werror=return-type
lib_deps = 
    nrf24/RF24@^1.6.2
lib_ldf_mode = chain+
src_filter = +<*> -<.git/> -<test/>

[env:esp32dev_test]
platform = native
framework = 
build_flags = 
    -std=c++17
    -Wall
    -Wextra
    -Werror=return-type
    -Iinclude
    -Isrc
src_filter = +<test/> +<src/*.cpp> -<src/main.cpp>
test_filter = test_*