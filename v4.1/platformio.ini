[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
lib_deps =
    nrf24/RF24@^1.4.9
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -Werror
    -Wall
    -Wextra
    -Wno-pedantic
    -Wno-unknown-pragmas
    -std=gnu++17
test_framework = unity
test_build_src = yes

[env:native]
platform = native
test_framework = unity
build_flags =
    -Werror
    -Wall
    -Wextra
    -Wno-pedantic
    -std=gnu++17
test_src_filter = +<test/*> -<src/*>