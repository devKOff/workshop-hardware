<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Solar Monitor{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  {% block extra_head %}{% endblock %}
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <h1>&#9728; Solar Panel Performance Monitor</h1>
      <div class="status-chip" id="status-chip" title="Sensor connection status">&#9679; initializing&#8230;</div>
    </div>
  </header>

  <nav class="site-nav">
    <a href="{{ url_for('index') }}">Dashboard</a>
    <a href="{{ url_for('history_page') }}">History &amp; CSV</a>
  </nav>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <p>Raspberry Pi 3 A+ &#8226; INA219 &#8226; SQLite &#8226; Flask &#8226; Local network only</p>
  </footer>

  {% block scripts %}{% endblock %}
</body>
</html>
