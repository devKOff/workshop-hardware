[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "solar-panel-performance-monitor"
version = "1.0.0-dev"
description = "Native PySide6 desktop application for monitoring solar-panel performance (INA219, SQLite, CSV reports)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Private / internal use" }
authors = [{ name = "Solar Panel Performance Monitor" }]
keywords = ["solar", "ina219", "raspberry-pi", "pyside6", "monitoring"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: Other/Proprietary License",
    "Natural Language :: English",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Hardware",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0,<9.0",
    "pytest-qt>=4.0.0,<5.0",
]
plots = [
    "pyqtgraph>=0.13.0,<0.14",
]
hardware = [
    "adafruit-circuitpython-ina219>=4.2,<5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
filterwarnings = [
    "default",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["solar_monitor*"]
